version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        APP_ENV: prod
    container_name: cpa-mgt
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 持久化存储目录 (sqlite 数据库和日志)
      - ./storage:/app/storage
      # 自定义配置文件
      - ./config:/app/config:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 可选：MySQL 服务
